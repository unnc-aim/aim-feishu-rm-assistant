# All-in-one stack: the Feishu assistant WITH a private rm-search
# (PostgreSQL + Meilisearch + rm-search), so the bot does not depend on
# the public search.scutbot.cn deployment.
#
# Usage (image-only, no repo checkout needed; the rm-search binary
# applies the database schema itself at startup):
#   # .env needs, besides the FEISHU_*/LLM_* vars:
#   #   POSTGRES_PASSWORD / MEILI_MASTER_KEY
#   docker compose up -d
#
# First-run bootstrap (see README "全量部署" section):
#   docker compose run --rm --entrypoint /usr/local/bin/setup-index rm-search
#   docker compose run --rm --entrypoint /usr/local/bin/crawl rm-search \
#     --announce-start 1 --announce-end 3000
#   nohup docker compose run --rm --entrypoint /usr/local/bin/crawl rm-search \
#     --posts-start 0 --posts-end 2000000 --posts-goroutines 50 \
#     >> crawl.log 2>&1 &
#   docker compose run --rm --entrypoint /usr/local/bin/recreate-index rm-search
name: aim-feishu-rm-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: rm_search
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/full/pg:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rm_search"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_NO_ANALYTICS: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/full/meili:/meili_data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  rm-search:
    image: ghcr.io/unnc-aim/rm-search:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    # Render the config from environment variables on every start (so
    # secret rotation in .env always takes effect), keep it on a shared
    # volume for the one-shot tools (setup-index/crawl/recreate-index),
    # then hand over to the server process.
    command:
      - |
        printf 'DataSource: "host=postgres port=5432 user=postgres password=%s dbname=rm_search sslmode=disable"\nMeiliSearch:\n  Address: "http://meilisearch:7700"\n  APIKey: "%s"\nTikaHost: ""\nSearchLog:\n  Enabled: true\nProxy:\n  Enabled: false\nDJIMetaKey: ""\n' \
          "$$POSTGRES_PASSWORD" "$$MEILI_MASTER_KEY" > /root/etc/config.yaml
        exec /usr/local/bin/rm-search -config /root/etc/config.yaml
    ports:
      - "${RMSEARCH_PORT:-8081}:8080"
    volumes:
      - rm-search-config:/root/etc
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  assistant:
    # For local development (e.g. arm64 Macs) comment the image line back
    # to `build: .` to build natively instead of pulling the amd64 image.
    # build: .
    image: ghcr.io/unnc-aim/aim-feishu-rm-assistant:latest
    restart: unless-stopped
    depends_on:
      - rm-search
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Bundled rm-search by default; set RMSEARCH_BASE_URL in .env to
      # use an external deployment instead.
      RMSEARCH_BASE_URL: ${RMSEARCH_BASE_URL:-http://rm-search:8080}
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

volumes:
  rm-search-config:
